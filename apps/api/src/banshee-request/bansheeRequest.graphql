# The SDL is our source of truth when building the API.
# We can split it into multiple files, this allows schemas to be closer to their appropriate resolvers and business domain.

scalar DateTime
scalar Upload
scalar JSON
scalar BigInt

enum RingPosition {
  RH_BACKS
  RH_SHOULDER
  RH_WALL_UPPER
  RH_WALL_CENTER
  RH_WALL_LOWER
  RH_FACE_HIGH
  RH_FACE_LOW
  LH_BACKS
  LH_SHOULDER
  LH_WALL_UPPER
  LH_WALL_CENTER
  LH_WALL_LOWER
  LH_FACE_HIGH
  LH_FACE_LOW
  CENTER_BACKS
}
"""
BansheeRequest model
Define the BansheeRequest model and its fields
"""
type BansheeRequest {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!

  serialNumber: String!
  name: String
  levelId: String!
  driveId: String!
  locationId: String!
  companyId: String!
  coordinates: JSON
  period: Int!
  locationDetails: String
  boltInstallationDateTime: DateTime
  ringPosition: RingPosition
  comment: String
  isBrokenBolt: Boolean!
  isNotMeasurable: Boolean!
  images: [String!]
  deviceAndMeasurements: [ProceqData!]!
  eventLogs: [BansheeEventLog!]!
  measured: Boolean!

  createdBy: String!
  updatedBy: String

  level: Level
  drive: Drive
  location: Location
  company: Company
  site: Site
  siteId: String!
  boltType: String
}

"""
CreateBansheeRequestInput
Define the input fields to create a new banshee request
"""
input CreateBansheeRequestInput {
  serialNumber: String!
  name: String
  levelId: String!
  driveId: String!
  locationId: String!
  coordinates: JSON
  period: Int!
  locationDetails: String
  boltInstallationDateTime: DateTime
  ringPosition: RingPosition
  comment: String
  isBrokenBolt: Boolean!
  isNotMeasurable: Boolean!
  images: [Upload!]
  boltType: String
  companyId: String!
  siteId: String!
}

"""
UpdateBansheeRequestInput
Define the input fields to update an existing banshee request
"""
input UpdateBansheeRequestInput {
  serialNumber: String
  name: String
  levelId: String
  driveId: String
  locationId: String
  coordinates: JSON
  period: Int
  locationDetails: String
  boltInstallationDateTime: DateTime
  ringPosition: RingPosition
  comment: String
  isBrokenBolt: Boolean
  isNotMeasurable: Boolean
  images: [Upload!]
  measured: Boolean
  boltType: String
  companyId: String
  siteId: String
}
"""
BansheeRequestResponse
Response structure for paginated list of banshee requests
"""
type BansheeRequestResponse {
  totalRecords: Int!
  results: [BansheeRequest!]!
}

type LocationDistribution {
  locationId: String!
  locationName: String!
  total: Int!
  statusCounts: [StatusCount!]!
}

type BansheeStatusDistribution {
  total: Int!
  statusCounts: [StatusCount!]!
  byLocation: [LocationDistribution!]
}

"""
Query
Define the queries that can be made to the BansheeRequest model
"""
type Query {
  bansheeRequests(
    offset: Int
    limit: Int
    serialNumber: String
    measured: Boolean
    period: Int
    driveId: String
    locationId: String
    createdBy: String
    companyId: String
    siteId: String
    timeFilter: String
  ): BansheeRequestResponse!

  bansheeRequest(id: String!): BansheeRequest!

  bansheeStatusDistribution(
    companyId: String
    siteId: String
    locationId: String
    timeFilter: String
  ): BansheeStatusDistribution!

  bansheeEventLogs(
    offset: Int
    limit: Int
    companyId: String
    siteId: String
  ): BansheeEventLogResponse!
}

type StatusCount {
  status: String!
  count: Int!
}

type BansheeStatusDistribution {
  total: Int!
  statusCounts: [StatusCount!]!
}

"""
Mutation
Define the mutations that can be made to the BansheeRequest model
"""
type Mutation {
  createBansheeRequest(createBansheeRequestInput: CreateBansheeRequestInput!): BansheeRequest!

  updateBansheeRequest(
    id: String!
    updateBansheeRequestInput: UpdateBansheeRequestInput!
  ): BansheeRequest!

  deleteBansheeRequest(id: String!): BansheeRequest!

  markBansheeRequestMeasured(id: String!): BansheeRequest!

  finalizeBansheeSession: Int!
}

type BansheeEventLog {
  id: String!
  createdAt: DateTime!
  eventType: String!
  previousStatus: String!
  newStatus: String!
  source: String
  measurementId: String
  bansheeRequestId: String!
  bansheeRequest: BansheeRequest
}

type BansheeEventLogResponse {
  totalRecords: Int!
  results: [BansheeEventLog!]!
}