# command to build and run: docker compose -f docker-compose.dev.yml up --build

# version: '3.8'

services:
  dev-db:
    image: postgres:13
    ports:
      - 5434:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: nest
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - playground

  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - 5555:80 # Web UI - access at http://localhost:5555
      - 2525:25 # SMTP port application
    environment:
      - ServerOptions__HostName=smtp4dev
      - ServerOptions__LockSettings=false
    volumes:
      - smtp4dev-data:/smtp4dev
    networks:
      - playground

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ground-support-platform-api:1.0.0
    depends_on:
      - dev-db
    command: >
      sh -c "pnpm run prisma:dev:deploy && pnpm run seed:dev && pnpm run start:dev"
    environment:
      DATABASE_URL: postgresql://postgres:123@dev-db:5432/nest?schema=public
    env_file:
      - ./apps/api/.env.dev
    ports:
      - '3333:3333'
    networks:
      - playground

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ground-support-platform-web:1.0.0
    depends_on:
      - api
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://api:3333/graphql
    env_file:
      - ./apps/web/.env.dev
    command: pnpm start
    networks:
      - playground

  pull-test:
    build:
      context: .
      dockerfile: apps/pull-test/Dockerfile
    image: ground-support-platform-pull-test:1.0.0
    depends_on:
      - api
    ports:
      - '3001:3001'
    environment:
      NEXT_PUBLIC_API_URL: http://api:3333/graphql
    env_file:
      - ./apps/pull-test/.env.dev
    command: pnpm start
    networks:
      - playground

networks:
  playground:

volumes:
  postgres_data_dev:
  smtp4dev-data:
