events {}

http {
    upstream api_upstream {
        server api:3333;
    }

    server {
        listen 80;

        # Redirect root (/) to NextAuth signin page
        location = / {
            return 302 /api/auth/signin?callbackUrl=/administration-portal;
        }

        # Browser-facing NextAuth pages (signin form, reset-password, etc.) → Next.js
        location ^~ /api/auth/ {
            proxy_pass http://web:3000/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
        }

        # All other API routes → NestJS
        location /api {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
        }

        # Main web app
        location / {
            proxy_pass http://web:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
        }

        # Pull-test app
        location /pull-test {
            proxy_pass http://pull-test:3001/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
        }
    }
}
