# The SDL is our source of truth when building the API.
# We can split it into multiple files, this allows schemas to be closer to their appropriate resolvers and business domain.

# Use npx ts-node src/generate-types.ts to generate the types

scalar DateTime

"""
User model
Define the User model and its fields
"""
type User {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  email: String!
  fullName: String!
  workPlace: String!
  phoneNumber: String
  globalRole: String
  isGlobalVisibility: Boolean
  userPermissions: [UserPermission!]
}

"""
UpdateUserInput
Define the input fields to update an existing user
Optional are marked without the exclamation mark
"""
input UpdateUserInput {
  email: String
  fullName: String
  workPlace: String
  phoneNumber: String
  globalRole: String
  isGlobalVisibility: Boolean
}

input UpdatePasswordInput {
  oldPassword: String
  newPassword: String
  confirmPassword: String
}

"""
Query
Define the queries that can be made to the User model
"""
type Query {
  users(roles: [String]): [User!]!
  user(id: String!): User!
}

"""
Mutation
Define the mutations that can be made to the User model
"""
type Mutation {
  updateUser(
    id: String!
    updateUserInput: UpdateUserInput!
    updatePasswordInput: UpdatePasswordInput
  ): User!
  removeUser(id: String!): User!
}
