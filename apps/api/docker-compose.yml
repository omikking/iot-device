version: '3.8'
services:
  dev-db:
    image: postgres:13
    ports:
      - 5434:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: nest
    networks:
      - playground
  test-db:
    image: postgres:13
    ports:
      - 5435:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: nest
    networks:
      - playground
  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - 5555:80 # Web UI - access at http://localhost:5555
      - 2525:25 # SMTP port application
    environment:
      - ServerOptions__HostName=smtp4dev
      - ServerOptions__LockSettings=false
    volumes:
      - smtp4dev-data:/smtp4dev
    networks:
      - playground
networks:
  playground:
volumes:
  smtp4dev-data:
