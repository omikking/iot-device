scalar DateTime

type BansheeSessionStats {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  
  sessionDate: DateTime!
  
  totalMeasured: Int!
  notMeasurable: Int!
  broken: Int!
  site: Site!
  company: Company
}

type Query {
  bansheeSessionStats(
    startDate: DateTime!
    endDate: DateTime!
    companyId: String
    siteId: String
  ): [BansheeSessionStats!]!
}
