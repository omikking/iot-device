# The SDL is our source of truth when building the API.
# We can split it into multiple files, this allows schemas to be closer to their appropriate resolvers and business domain.

# Use npx ts-node src/generate-types.ts to generate the types

scalar DateTime
scalar Upload

"""
BoltResult model
Define the BoltResult model and its fields
"""
type BoltResult {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  measuredAt: DateTime!

  boltNumber: Int!
  boltType: String!
  peakLoad: [Int!]!
  peakDisplacement: [Int!]!
  positionInRing: String!
  result: String!
  isHazard: Boolean!
  hazardCompletedDate: [DateTime!]
  abortReason: String
  comment: String
  image: String

  siteId: String!
  levelId: String!
  driveId: String!
  locationId: String!
  userId: String!

  site: Site
  level: Level
  drive: Drive
  location: Location
}

"""
CreateBoltResultInput
Define the input fields to create a new boltResult
"""
input CreateBoltResultInput {
  measuredAt: DateTime!
  boltNumber: Int!
  boltType: String!
  peakLoad: [Int!]!
  peakDisplacement: [Int!]!
  positionInRing: String!
  result: String!
  isHazard: Boolean!
  abortReason: String
  comment: String
  image: Upload
  siteId: String!
  levelId: String!
  driveId: String!
  locationId: String!
  userId: String!
}

"""
UpdateBoltResultInput
Define the input fields to update an existing boltResult
Optional are marked without the exclamation mark
"""
input UpdateBoltResultInput {
  id: String
  boltNumber: Int
  boltType: String
  peakLoad: [Int!]
  peakDisplacement: [Int!]
  positionInRing: String
  result: String
  isHazard: Boolean
  hazardCompletedDate: [DateTime!]
  abortReason: String
  comment: String
  image: Upload
  measuredAt: DateTime
}

"""
BoltResultResponse
Response structure for paginated list of bolt results
"""
type BoltResultResponse {
  failedCount: Int!
  hazardCount: Int!
  passedCount: Int!
  totalRecords: Int!
  averageTons: Float
  results: [BoltResult!]!
}

"""
Query
Define the queries that can be made to the BoltResult model
"""
type Query {
  boltResults(
    offset: Int
    limit: Int
    siteId: String
    levelId: String
    driveId: String
    locationId: String
    result: [String!]
    isHazard: Boolean
    withImage: Boolean
    withComment: Boolean
    startDate: DateTime
    endDate: DateTime
  ): BoltResultResponse!

  boltResult(id: String!): BoltResult!
}

"""
Mutation
Define the mutations that can be made to the BoltResult model
"""
type Mutation {
  createBoltResult(createBoltResultInput: CreateBoltResultInput!): BoltResult!

  updateBoltResult(
    id: String!
    updateBoltResultInput: UpdateBoltResultInput!
  ): BoltResult!

  removeBoltResult(id: String!): BoltResult!

  createBoltResults(
    siteId: String!
    createBoltResultsInput: [CreateBoltResultInput!]!
  ): [BoltResult!]!

  updateBoltResults(
    updateBoltResultsInput: [UpdateBoltResultInput!]!
  ): [BoltResult!]!

  removeBoltResults(ids: [String!]!): [BoltResult!]!
}
