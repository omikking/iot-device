<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline</title>
    <meta name="description" content="Offline fallback page" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
        padding: 20px;
      }

      .card {
        width: min(560px, 100%);
        background: #fff;
        border-radius: 20px;
        padding: 36px 32px;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,.07), 0 10px 40px -4px rgba(0,0,0,.08);
      }

      /* ── Icon ── */
      .icon-wrap {
        width: 64px; height: 64px;
        background: #fef3c7;
        border-radius: 16px;
        display: grid;
        place-items: center;
        margin-bottom: 20px;
      }
      .icon-wrap svg { width: 32px; height: 32px; stroke: #d97706; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

      /* ── Status pill ── */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: #b45309;
        background: #fffbeb;
        border: 1px solid #fde68a;
        border-radius: 999px;
        padding: 4px 10px;
        margin-bottom: 14px;
      }
      .dot {
        width: 7px; height: 7px;
        background: #f59e0b;
        border-radius: 50%;
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: .45; transform: scale(.75); }
      }

      h1 {
        font-size: clamp(1.35rem, 3vw, 1.75rem);
        font-weight: 700;
        line-height: 1.25;
        margin-bottom: 10px;
      }

      .subtitle {
        font-size: .95rem;
        line-height: 1.65;
        color: #64748b;
        margin-bottom: 24px;
      }

      /* ── Actions ── */
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 28px;
      }

      button {
        border: none;
        border-radius: 10px;
        font-size: .92rem;
        font-weight: 600;
        padding: 10px 18px;
        cursor: pointer;
        transition: opacity .15s, transform .1s;
      }
      button:active { transform: scale(.97); }

      .btn-primary { background: #0f766e; color: #fff; }
      .btn-primary:hover { background: #115e59; }
      .btn-ghost  { background: #f1f5f9; color: #334155; }
      .btn-ghost:hover  { background: #e2e8f0; }

      @media (max-width: 460px) {
        .card { padding: 24px 20px; }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-live="polite">

      <div class="icon-wrap" aria-hidden="true">
        <!-- wifi-off icon -->
        <svg viewBox="0 0 24 24">
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <circle cx="12" cy="20" r="1" fill="#d97706" stroke="none"/>
        </svg>
      </div>

      <div class="pill">
        <span class="dot" aria-hidden="true"></span>
        No connection
      </div>

      <h1>You're offline right now</h1>
      <p class="subtitle">
        Can't reach the server. Check your network connection and try again —
        cached pages may still be available.
      </p>

      <div class="actions">
        <button class="btn-primary" type="button" onclick="location.reload()">
          ↺ &nbsp;Retry
        </button>
        <button class="btn-ghost" type="button" onclick="history.back()">
          ← &nbsp;Go back
        </button>
      </div>

    </main>
  </body>
</html>
