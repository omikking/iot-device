scalar DateTime

type BansheeSessionStats {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  
  sessionDate: DateTime!
  
  totalMeasured: Int!
  totalWithLogs: Int!
  notMeasurable: Int!
  broken: Int!
  
  company: Company!
}

type Query {
  getStats(date: DateTime!, companyId: String): [BansheeSessionStats!]!
  statsForPeriod(
    startDate: DateTime!
    endDate: DateTime!
    companyId: String
  ): [BansheeSessionStats!]!
}
