# The SDL is our source of truth when building the API.
# We can split it into multiple files, this allows schemas to be closer to their appropriate resolvers and business domain.

# Use npx ts-node src/generate-types.ts to generate the types

"""
Company model
Define the Company model and its fields
"""
type Company {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  orgNumber: String!
  adress: String!
  postalCode: String!
  city: String!
  country: String!
  companyContactEmail: String!
  users: [User!]
  plans: [Plan!]
  sites: [Site!]
}

"""
Plan model
Define the Plan model and its fields
"""
type Plan {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  companyId: String!
  applicationName: String!
  planLevel: String!
  expiringDate: DateTime
}

"""
Site model
Define the Site model and its fields
"""
type Site {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  siteName: String!
  adress: String!
  postalCode: String!
  city: String!
  country: String!
}

"""
User model
Define the User model and its fields
"""
type User {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  email: String!
  fullName: String!
  workPlace: String!
  phoneNumber: String
  globalRole: String
  isGlobalVisibility: Boolean
  userPermission: [UserPermission!]
}

"""
UserPermission model
Define the UserPermission model and its fields
"""
type UserPermission {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  userId: String!
  role: String!
  appsAccess: [String!]
}

"""
CreateCompanyInput
Define the input fields to create a new company
"""
input CreateCompanyInput {
  name: String!
  orgNumber: String!
  adress: String!
  postalCode: String!
  city: String!
  country: String!
  companyContactEmail: String!
  userPermissions: [CreateUserPermissionInput!]!
  plans: [CreatePlanInput!]
}

"""
CreateUserPermissionInput
Define the input fields to create a new userPermission
"""
input CreateUserPermissionInput {
  userId: String!
}

"""
CreatePlanInput
Define the input fields to create a new plan
"""
input CreatePlanInput {
  applicationName: String!
  planLevel: String!
  expiringDate: DateTime
}

"""
UpdateCompanyInput
Define the input fields to update an existing company
Optional are marked without the exclamation mark
"""
input UpdateCompanyInput {
  name: String
  orgNumber: String
  adress: String
  postalCode: String
  city: String
  country: String
  companyContactEmail: String
  userPermissions: [UpdateUserPermissionInput!]
  plans: [UpdatePlanInput!]
}

"""
UpdatePlanInput
Define the input fields to update the plans
"""
input UpdatePlanInput {
  id: String!
  applicationName: String!
  planLevel: String!
  expiringDate: DateTime
}

"""
UpdateUserPermissionInput
Define the input fields to update the sandvik admin to new admin
"""
input UpdateUserPermissionInput {
  oldUserId: String!
  newUserId: String!
}

"""
Query
Define the queries that can be made to the Company model
"""
type Query {
  companies: [Company!]!
  company(id: String!): Company!
}

"""
Mutation
Define the mutations that can be made to the Company model
"""
type Mutation {
  createCompany(createCompanyInput: CreateCompanyInput!): Company!
  updateCompany(id: String!, updateCompanyInput: UpdateCompanyInput!): Company!
  removeCompany(id: String!): Company!
}
