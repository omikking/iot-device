# command to build and run: docker-compose -f docker-compose.dev.yml up --build

# version: '3.8'

services:
  dev-db:
    image: postgres:13
    ports:
      - 5434:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: nest
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
  # test-db:
  #   image: postgres:13
  #   ports:
  #     - 5435:5432
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: 123
  #     POSTGRES_DB: nest
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data-test
  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - 5555:80 # Web UI - access at http://localhost:5555
      - 2525:25 # SMTP port application
    environment:
      - ServerOptions__HostName=smtp4dev
      - ServerOptions__LockSettings=false
    volumes:
      - smtp4dev-data:/smtp4dev

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      # - test-db
      - dev-db
    environment:
      DATABASE_URL: postgresql://postgres:123@dev-db:5432/nest?schema=public
    ports:
      - '4000:4000'
    command: pnpm run start:dev
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    command: pnpm run dev
    volumes:
      - .:/app
      - /app/node_modules

  pull-test:
    build:
      context: .
      dockerfile: apps/pull-test/Dockerfile
    depends_on:
      - api
    ports:
      - '3001:3001'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    command: pnpm start
    volumes:
      - .:/app
      - /app/node_modules

networks:
  playground:
volumes:
  postgres_data_dev:
  # postgres-data-test:
  smtp4dev-data:


