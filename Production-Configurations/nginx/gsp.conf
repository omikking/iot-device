ubuntu@ip-10-30-1-153:/etc/nginx/sites-available$ cat gsp.conf

# Define upstreams (local Docker/VM services)
upstream api_upstream {
    server 127.0.0.1:3333;
}

upstream web_upstream {
    server 127.0.0.1:3000;
}

upstream pulltest_upstream {
    server 127.0.0.1:3001;
}

upstream banshee_upstream {
    server 127.0.0.1:3002;
}
# ================================
# HTTP (80) block
# - Redirects browsers to HTTPS
# - Still proxies HTTP if App Gateway terminates TLS
# ================================
server {
    listen 80;
    listen [::]:80;
    server_name groundsupport.mining.sandvik portal.groundsupport.mining.sandvik pulltest.groundsupport.mining.sandvik xcellbanshee.groundsupport.mining.sandvik;

      location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # Normal browsers → redirect
    return 301 https://$host$request_uri;
}




# =====================================================
# API + NextAuth routes (groundsupport.mining.sandvik)
# =====================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name groundsupport.mining.sandvik;

    access_log /var/log/nginx/api_access.log;
    error_log  /var/log/nginx/api_error.log;

    # SSL certs (from ~/certs/)
   # ssl_certificate     /home/gspdeploy/certs/_.groundsupport.mining.sandvik-fullchain.crt;
   # ssl_certificate_key /home/gspdeploy/certs/_.groundsupport.mining.sandvik.key;
    ssl_certificate     /etc/nginx/ssl/groundsupport/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/groundsupport/_.groundsupport.mining.sandvik.key;



    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # Enable Gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

     # Health probe endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

# Allow images
location /uploads/ {
proxy_pass http://api_upstream;
proxy_http_version 1.1;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
}

    # Proxy REST auth routes to central API
location ^~ /auth/ {
    proxy_pass http://api_upstream;
    include proxy_params;

    # Make sure backend sees a consistent host (optional, if backend expects groundsupport host)
    # proxy_set_header Host groundsupport.mining.sandvik;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
    # Proxy GraphQL requests to the API upstream (preserves /graphql)
location ^~ /graphql {
    # Forward /graphql -> backend /graphql
    proxy_pass http://api_upstream;
    include proxy_params;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;


}

       # API routes
    location ^~ /api/ {
        proxy_pass http://api_upstream;
        include proxy_params;
    }

    # Block all other routes to prevent Nginx welcome page or web app exposure
    location / {
        return 403;
    }

    # All other API requests → NestJS backend
    #location /api {
     #   proxy_pass http://api_upstream;
      #  include proxy_params;
    #}
}

# =====================================================
# Portal (Next.js web app)
# =====================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.groundsupport.mining.sandvik;

    access_log /var/log/nginx/web_access.log;
    error_log  /var/log/nginx/web_error.log;

    #ssl_certificate     /home/gspdeploy/certs/_.groundsupport.mining.sandvik-fullchain.crt;
    #ssl_certificate_key /home/gspdeploy/certs/_.groundsupport.mining.sandvik.
    ssl_certificate     /etc/nginx/ssl/groundsupport/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/groundsupport/_.groundsupport.mining.sandvik.key;



    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;


    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # Enable Gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

     # Health probe endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }
     # Redirect root to administration-portal
    location = / {
        return 302 /administration-portal;
    }
    #  NextAuth routes → API container
    location ^~ /api/auth/ {
    proxy_pass http://web_upstream;
    include proxy_params;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
     # Rewrite cookies so sessions are valid across subdomains
    proxy_cookie_domain portal.groundsupport.mining.sandvik .groundsupport.mining.sandvik;
    proxy_cookie_domain pulltest.groundsupport.mining.sandvik .groundsupport.mining.sandvik;
    proxy_cookie_domain groundsupport.mining.sandvik .groundsupport.mining.sandvik;
    proxy_cookie_domain xcellbanshee.groundsupport.mining.sandvik .groundsupport.mining.sandvik;
}


    # API routes → forward to API backend
    location ^~ /api/ {
        proxy_pass http://web_upstream/;
        include proxy_params;
    }

    location / {
        proxy_pass http://web_upstream/;
        include proxy_params;
    }
}

# =====================================================
# Pull-test (Next.js app)
# =====================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pulltest.groundsupport.mining.sandvik;

    access_log /var/log/nginx/pulltest_access.log;
    error_log  /var/log/nginx/pulltest_error.log;

   # ssl_certificate     /home/gspdeploy/certs/_.groundsupport.mining.sandvik-fullchain.crt;
    #ssl_certificate_key /home/gspdeploy/certs/_.groundsupport.mining.sandvik.key;

    ssl_certificate     /etc/nginx/ssl/groundsupport/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/groundsupport/_.groundsupport.mining.sandvik.key;


    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # Enable Gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;


    # Health probe endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    #  NextAuth routes → API container
    location ^~ /api/auth/ {
        proxy_pass http://pulltest_upstream;
        include proxy_params;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

         # Rewrite cookies so sessions are valid across subdomains
        proxy_cookie_domain portal.groundsupport.mining.sandvik .groundsupport.mining.sandvik;
        proxy_cookie_domain pulltest.groundsupport.mining.sandvik .groundsupport.mining.sandvik;
        proxy_cookie_domain groundsupport.mining.sandvik .groundsupport.mining.sandvik;
        proxy_cookie_domain xcellbanshee.groundsupport.mining.sandvik .groundsupport.mining.sandvik;
    }
    # API routes → backend
    location ^~ /api/ {
        proxy_pass http://pulltest_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://pulltest_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name xcellbanshee.groundsupport.mining.sandvik;

    add_header X-Debug-Server "banshee-nginx-block" always;
    access_log /var/log/nginx/banshee_access.log;
    error_log  /var/log/nginx/banshee_error.log;

    ssl_certificate     /etc/nginx/ssl/groundsupport/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/groundsupport/_.groundsupport.mining.sandvik.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Health probe endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # NextAuth routes
    location ^~ /api/auth/ {
        proxy_pass http://banshee_upstream;
        include proxy_params;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cookie_domain portal.groundsupport.mining.sandvik .groundsupport.mining.sandvik;
        proxy_cookie_domain pulltest.groundsupport.mining.sandvik .groundsupport.mining.sandvik;
        proxy_cookie_domain xcellbanshee.groundsupport.mining.sandvik .groundsupport.mining.sandvik;
        proxy_cookie_domain groundsupport.mining.sandvik .groundsupport.mining.sandvik;
    }

    # API routes
    location ^~ /api/ {
        proxy_pass http://banshee_upstream/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        add_header X-Debug-Location "banshee-root-location" always;
        proxy_pass http://banshee_upstream/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}