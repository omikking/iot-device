# The SDL is our source of truth when building the API.
# We can split it into multiple files, this allows schemas to be closer to their appropriate resolvers and business domain.

# Use npx ts-node src/generate-types.ts to generate the types

scalar DateTime

"""
Site model
Define the Site model and its fields
"""
type Site {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  siteName: String!
  address: String!
  postalCode: String!
  city: String!
  country: String!

  companyId: String!
  levels: [Level!]
  boltResults: [BoltResult!]
}

"""
CreateSiteInput
Define the input fields to create a new site
"""
input CreateSiteInput {
  siteName: String!
  address: String!
  postalCode: String!
  city: String!
  country: String!
  companyId: String!
}

"""
UpdateSiteInput
Define the input fields to update an existing site
Optional are marked without the exclamation mark
"""
input UpdateSiteInput {
  siteName: String
  address: String
  postalCode: String
  city: String
  country: String
  companyId: String!
}

"""
Query
Define the queries that can be made to the Site model
"""
type Query {
  sites: [Site!]!
  site(id: String!): Site!
}

"""
Mutation
Define the mutations that can be made to the Site model
"""
type Mutation {
  createSite(createSiteInput: CreateSiteInput!): Site!
  updateSite(id: String!, updateSiteInput: UpdateSiteInput!): Site!
  removeSite(id: String!): Site!
}
