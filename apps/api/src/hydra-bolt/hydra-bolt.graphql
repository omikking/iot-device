scalar DateTime

type Hydrabolt {
  id: String!
  partNumber: String!
  drawingNumber: String
  boltLength: Float!
  description: String
  numberOfFBG: Int!
  positionOfFBGs: [Float!]!
  initialWavelength: [Float!]!
  elasticLimit: Float!
  lowPlasticLimit: Float!
  highPlasticLimit: Float!
  maxCalibrationFactor: Float!
  minCalibrationFactor: Float!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateHydraboltInput {
  partNumber: String!
  drawingNumber: String
  boltLength: Float!
  description: String
  numberOfFBG: Int!
  positionOfFBGs: [Float!]!
  initialWavelength: [Float!]!
  elasticLimit: Float!
  lowPlasticLimit: Float!
  highPlasticLimit: Float!
  maxCalibrationFactor: Float!
  minCalibrationFactor: Float!
}

type Mutation {
  createHydrabolt(input: CreateHydraboltInput!): Hydrabolt!
}
