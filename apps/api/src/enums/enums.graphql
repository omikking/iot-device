enum Role {
  COMPANY_USER
  COMPANY_ADMIN
  SANDVIK_ADMIN
  SANDVIK_TECHNICIAN
}

enum Result {
  PASS
  FAIL
  ABORT
}

enum Application {
  PULL_TEST
  PULL_TEST_OPERATOR
  XCYCLOPS
  ULTRABOLTS
}

enum PlanLevel {
  GOLD
  SILVER
  BRONZE
  INACTIVE
}

enum BoltType {
  MD47
  MDX47
}

enum PullTestAbortReason {
  NOT_TESTED_VOID_CAVITY
  TEST_STOPPED_INSTALL_ANGLE
}

enum RingPositionEnum {
  LH_Backs
  Center_Backs
  RH_Backs
  LH_Face_High
  LH_Face_Low
  RH_Face_High
  RH_Face_Low
  LH_Shoulder
  LH_Wall_Upper
  LH_Wall_Center
  LH_Wall_Lower
  RH_Shoulder
  RH_Wall_Upper
  RH_Wall_Center
  RH_Wall_Lower
}

type EnumOption {
  key: RingPositionEnum!
  value: String!
}

type Enums {
  roles: [Role!]!
  results: [Result!]!
  boltTypes: [BoltType!]!
  ringPosition: [EnumOption!]!
  pullTestAbortReason: [PullTestAbortReason!]!
  getApplication: [Application!]!
  getPlanLevel: [PlanLevel!]!
}

type Query {
  enums: Enums!
}
