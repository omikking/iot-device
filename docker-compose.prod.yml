# docker-compose.prod.yml
# Build + run all services

services:
  prod-db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: nest
    ports:
      - '5434:5432'
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nest']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - playground

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ground-support-platform-api:1.0.0
    depends_on:
      prod-db:
        condition: service_healthy
    # In prod we migrate schema (no dev seeding), then start Nest in prod mode.
    command: >
      sh -c "pnpm prisma:migrate:deploy && pnpm start:prod"
    environment:
      #NODE_ENV: production
        #DATABASE_URL: postgresql://postgres:123@prod-db:5432/nest?schema=public
    env_file:
      - ./apps/api/.env.production
    ports:
      - '3333:3333'
    restart: unless-stopped
    networks:
      - playground
    volumes:
      - /ground-support-platform/uploads:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ground-support-platform-web:1.0.0
    depends_on:
      - api
        #  environment:
      #  NODE_ENV: production
        #   NEXT_PUBLIC_API_URL: https://portal.groundsupport.mining.sandvik/api/graphql
    env_file:
      - ./apps/web/.env.production
    command: pnpm start
    ports:
      - '3000:3000'
    restart: unless-stopped
    networks:
      - playground

  pull-test:
    build:
      context: .
      dockerfile: apps/pull-test/Dockerfile
    image: ground-support-platform-pull-test:1.0.0
    depends_on:
      - api
    environment:
      #NODE_ENV: production
      # Also used by the browser → reach api via localhost
      #NEXT_PUBLIC_API_URL: https://pulltest.groundsupport.mining.sandvik/api/graphql
    env_file:
      - ./apps/pull-test/.env.production
    command: pnpm start
    ports:
      - '3001:3001'
    restart: unless-stopped
    networks:
      - playground

  banshee:
    build:
      context: .
      dockerfile: apps/banshee/Dockerfile
    image: ground-support-platform-banshee:1.0.0
    depends_on:
      - api
    environment:
      #NODE_ENV: production
      # Also used by the browser → reach api via localhost
      #NEXT_PUBLIC_API_URL: https://staging.groundsupport.mining.sandvik/api/graphql
    env_file:
      - ./apps/banshee/.env.production
    command: pnpm start
    ports:
      - '3002:3002'
    restart: unless-stopped
    networks:
      - playground

  hydra:
    build:
      context: .
      dockerfile: apps/hydra/Dockerfile
    image: ground-support-platform-hydra:1.0.0
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Also used by the browser → reach api via localhost
      NEXT_PUBLIC_API_URL: https://groundsupport.mining.sandvik
    env_file:
      - ./apps/hydra/.env.production
    command: pnpm start
    ports:
      - '3003:3003'
    restart: unless-stopped
    networks:
      - playground

  test-cyclops:
    build:
      context: .
      dockerfile: apps/test-cyclops/Dockerfile
    image: ground-support-platform-test-cyclops:1.0.0
    depends_on:
      - api
    environment:
      #NODE_ENV: production
      # Also used by the browser → reach api via localhost
      NEXT_PUBLIC_API_URL: https://staging.groundsupport.mining.sandvik/api/graphql
        #env_file:
        # - ./apps/test-cyclops/.env.production
    command: pnpm start
    ports:
      - '3011:3011'
    restart: unless-stopped
    networks:
      - playground

  test-professor:
    build:
      context: .
      dockerfile: apps/test-professor/Dockerfile
    image: ground-support-platform-test-professor:1.0.0
    depends_on:
      - api
    environment:
      #NODE_ENV: production
      # Also used by the browser → reach api via localhost
      #NEXT_PUBLIC_API_URL: https://staging.groundsupport.mining.sandvik/api/graphql
        #env_file:
        # - ./apps/test-cyclops/.env.production
    command: pnpm start
    ports:
      - '3013:3013'
    restart: unless-stopped
    networks:
      - playground

  test-hydra:
    build:
      context: .
      dockerfile: apps/test-hydra/Dockerfile
    image: ground-support-platform-test-hydra:1.0.0
    depends_on:
      - api
    environment:
      #NODE_ENV: production
      #NEXT_PUBLIC_API_URL: https://staging.groundsupport.mining.sandvik/api/graphql
    command: pnpm start
    ports:
      - '3012:3012'
    restart: unless-stopped
    networks:
      - playground

  test-optic-bolt:
    build:
      context: .
      dockerfile: apps/test-optic-bolt/Dockerfile
    image: ground-support-platform-test-optic-bolt:1.0.0
    depends_on:
      - api
        #environment:
      #NODE_ENV: production
        #NEXT_PUBLIC_API_URL: https://staging.groundsupport.mining.sandvik/api/graphql
    command: pnpm start
    ports:
      - '3014:3014'
    restart: unless-stopped
    networks:
      - playground

networks:
  playground:

volumes:
  postgres_data_prod:
    name: postgres_data_prod
