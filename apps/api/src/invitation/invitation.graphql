# The SDL is our source of truth when building the API.
# We can split it into multiple files, this allows schemas to be closer to their appropriate resolvers and business domain.

# Use npx ts-node src/generate-types.ts to generate the types

type Invitation {
  id: String!
  email: String!
  expiresAt: DateTime!
  used: Boolean!
  companyId: String
  globalRole: String
}

type InvitationResponse {
  invitationId: String
  userId: String
  isNewUser: Boolean!
}

type InvitationValidation {
  valid: Boolean!
  reason: String
  invitation: Invitation
}

input CreateInvitationInput {
  email: String!
  companyId: String!
  role: String!
  appsAccess: [String!]!
}

input CreateGlobalInvitationInput {
  email: String!
  globalRole: String!
}

input CompleteInvitationInput {
  id: String!
  token: String!
  fullName: String!
  password: String!
  workPlace: String!
  phoneNumber: String
}

type Mutation {
  createInvitation(input: CreateInvitationInput!): InvitationResponse!
  createGlobalInvitation(
    input: CreateGlobalInvitationInput!
  ): InvitationResponse!
  completeInvitation(input: CompleteInvitationInput!): User!
  resendInvitation(id: String!): Invitation!
  removeInvitation(id: String!): Invitation!
}

type Query {
  validateInvitation(id: String!, token: String!): InvitationValidation!
  pendingInvitations(companyId: String!): [Invitation!]!
  pendingGlobalInvitations: [Invitation!]!
}
