# The SDL is our source of truth when building the API.
# We can split it into multiple files, this allows schemas to be closer to their appropriate resolvers and business domain.

# Use npx ts-node src/generate-types.ts to generate the types
"""
Company model
Define the Company model and its fields
"""
type Company {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  orgNumber: String!
  address: String!
  postalCode: String!
  city: String!
  country: String!
  companyContactEmail: String!
  users: [User]
}

type User {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  email: String!
  fullName: String!
  workPlace: String!
  appsAccess: [String!]!
  phoneNumber: String
  globalRole: String
  companyRole: String
}

input UserPermission {
  userId: String!
  appsAccess: [String!]!
  companyRole: String!
  globalRole: String!
}

"""
CreateCompanyInput
Define the input fields to create a new company
"""
input CreateCompanyInput {
  name: String!
  orgNumber: String!
  address: String!
  postalCode: String!
  city: String!
  country: String!
  companyContactEmail: String!
  users: [UserPermission!]
}

"""
UpdateCompanyInput
Define the input fields to update an existing company
Optional are marked without the exclamation mark
"""
input UpdateCompanyInput {
  name: String
  orgNumber: String
  address: String
  postalCode: String
  city: String
  country: String
  companyContactEmail: String
  users: [UserPermission!]
}

"""
Query
Define the queries that can be made to the Company model
"""
type Query {
  companies: [Company!]!
  company(id: String!): Company!
}

"""
Mutation
Define the mutations that can be made to the Company model
"""
type Mutation {
  createCompany(createCompanyInput: CreateCompanyInput!): Company!
  updateCompany(id: String!, updateCompanyInput: UpdateCompanyInput!): Company!
  removeCompany(id: String!): Company!
}
