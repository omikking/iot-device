# The SDL is our source of truth when building the API.
# We can split it into multiple files, this allows schemas to be closer to their appropriate resolvers and business domain.

# Use npx ts-node src/generate-types.ts to generate the types

scalar DateTime

"""
Company model
Define the Company model and its fields
"""
type Company {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  name: String!
  orgNumber: String!
  address: String!
  postalCode: String!
  city: String!
  country: String!
  companyContactEmail: String!
  users: [User!]
  plans: [Plan!]
  sites: [Site!]
  sandvikAdminUserId: String
}

"""
Plan model
Define the Plan model and its fields
"""
type Plan {
  id: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  companyId: String!
  applicationName: String!
  planLevel: String!
  expiringDate: DateTime
}

"""
CreateCompanyInput
Define the input fields to create a new company
"""
input CreateCompanyInput {
  name: String!
  orgNumber: String!
  address: String!
  postalCode: String!
  city: String!
  country: String!
  companyContactEmail: String!
  sandvikAdminUserId: String
  plans: [CreatePlanInput!]
}

"""
CreatePlanInput
Define the input fields to create a new plan
"""
input CreatePlanInput {
  applicationName: String!
  planLevel: String!
  expiringDate: DateTime
}

"""
UpdateCompanyInput
Define the input fields to update an existing company
Optional are marked without the exclamation mark
"""
input UpdateCompanyInput {
  name: String
  orgNumber: String
  address: String
  postalCode: String
  city: String
  country: String
  companyContactEmail: String
  sandvikAdminUserId: String
  plans: [UpdatePlanInput!]
}

"""
UpdatePlanInput
Define the input fields to update the plans
"""
input UpdatePlanInput {
  id: String
  applicationName: String!
  planLevel: String
  expiringDate: DateTime
}

"""
UpdateAdminPermissionInput
Define the input fields to update the sandvik admin to new admin
"""
input UpdateAdminPermissionInput {
  oldUserId: String!
  newUserId: String!
}

"""
CompanyListResponse
Response structure for paginated list of companies
"""
type CompanyListResponse {
  totalRecords: Int!
  results: [Company!]!
}

"""
Query
Define the queries that can be made to the Company model
"""
type Query {
  companies(offset: Int, limit: Int, userId: String): CompanyListResponse!
  company(id: String!): Company!
}

"""
Mutation
Define the mutations that can be made to the Company model
"""
type Mutation {
  createCompany(createCompanyInput: CreateCompanyInput!): Company!
  updateCompany(id: String!, updateCompanyInput: UpdateCompanyInput!): Company!
  removeCompany(id: String!): Company!
}
