# docker-compose.prod.yml
# Build + run all services locally (no nginx yet)

services:
  prod-db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: nest
    ports:
      - '5434:5432'
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nest']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - playground

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      prod-db:
        condition: service_healthy
    # In prod we migrate schema (no dev seeding), then start Nest in prod mode.
    command: >
      sh -c "pnpm prisma:migrate:deploy && pnpm start:prod"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:123@prod-db:5432/nest?schema=public
    env_file:
      - ./apps/api/.env.production
    ports:
      - '3333:3333'
    restart: unless-stopped
    networks:
      - playground

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost/api/graphql
    env_file:
      - ./apps/web/.env.production
    command: pnpm start
    ports:
      - '3000:3000'
    restart: unless-stopped
    networks:
      - playground

  pull-test:
    build:
      context: .
      dockerfile: apps/pull-test/Dockerfile
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Also used by the browser → reach api via localhost
      NEXT_PUBLIC_API_URL: http://localhost/api/graphql
    env_file:
      - ./apps/pull-test/.env.production
    command: pnpm start
    ports:
      - '3001:3001'
    restart: unless-stopped
    networks:
      - playground

  #nginx:
    #image: nginx:latest
    #container_name: gsp_nginx
    #restart: unless-stopped
    #ports:
     # - "80:80"
    #volumes:
     # - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    #depends_on:
     # - web
      #- api
      #- pull-test
    #networks:
     # - playground

networks:
  playground:

volumes:
  postgres_data_prod:
