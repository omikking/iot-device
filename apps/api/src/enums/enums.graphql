enum Role {
  COMPANY_USER
  COMPANY_ADMIN
  SANDVIK_ADMIN
  SANDVIK_TECHNICIAN
}

enum Result {
  PASS
  FAIL
  ABORT
}

enum BoltType {
  MD47
  MDX47
}

enum RingPosition {
  RH_BACKS
  RH_SHOULDER
  RH_WALL_UPPER
  RH_WALL_CENTER
  RH_WALL_LOWER
  RH_FACE_HIGH
  RH_FACE_LOW
  LH_BACKS
  LH_SHOULDER
  LH_WALL_UPPER
  LH_WALL_CENTER
  LH_WALL_LOWER
  LH_FACE_HIGH
  LH_FACE_LOW
  CENTER_BACKS
}

enum PullTestAbortReason {
  NOT_TESTED_VOID_CAVITY
  TEST_STOPPED_INSTALL_ANGLE
}

enum Application {
  PULL_TEST
  PULL_TEST_TECHNICIAN
  BANSHEE
}

enum PlanLevel {
  GOLD
  SILVER
  BRONZE
  INACTIVE
}

type Query {
  getRoles: [Role!]!
  getResults: [Result!]!
  getBoltTypes: [BoltType!]
  getRingPosition: [RingPosition!]
  getPullTestAbortReason: [PullTestAbortReason!]
  getApplication: [Application!]
  getPlanLevel: [PlanLevel!]
}
