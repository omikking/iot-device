input RequestPasswordResetInput {
  email: String!
}

input ValidateResetTokenInput {
  email: String!
  token: String!
}

input ConfirmPasswordResetInput {
  token: String!
  email: String!
  newPassword: String!
  confirmPassword: String!
}

type Mutation {
  requestPasswordReset(input: RequestPasswordResetInput!): Boolean!
  validateResetToken(input: ValidateResetTokenInput!): Boolean!
  confirmPasswordReset(input: ConfirmPasswordResetInput!): Boolean!
}
