input RequestPasswordResetInput {
  email: String!
}

input ValidateResetTokenInput {
  email: String!
  token: String!
}

input ConfirmPasswordResetInput {
  token: String!
  email: String!
  newPassword: String!
  confirmPassword: String!
}

type Mutation {
  requestPasswordReset(requestPasswordResetInput: RequestPasswordResetInput!): Boolean!
  validateResetToken(validateResetTokenInput: ValidateResetTokenInput!): Boolean!
  confirmPasswordReset(confirmPasswordResetInput: ConfirmPasswordResetInput!): Boolean!
}
